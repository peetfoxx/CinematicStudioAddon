name: CinematicStudioAddon
version: '${project.version}'
main: sk.hypercube.cinematicstudioaddon.CinematicStudioAddon
api-version: '1.13'
author: peetfoxx
description: Open-source companion for CinematicStudio - console-triggered playback for specific players, and more.
website: https://github.com/peetfoxx/CinematicStudioAddon
softdepend: [CinematicStudio]

commands:
  cinaddon:
    description: CinematicStudioAddon commands
    usage: /<command> <play|stop> <cinematic> <player|@a>
    aliases: [csa, cinematicaddon]

permissions:
  cinematicstudioaddon.admin:
    description: Use CinematicStudioAddon admin commands
    default: op
